<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>POSTURA — Positioning Intelligence & Management System</title>
    <meta name="description" content="Sistema integral de desarrollo de marca y posicionamiento de autoridad para profesionales gestionado por IA y control humano." />
    <meta name="theme-color" content="#0a0f12" />
    <meta name="color-scheme" content="dark light" />
    <!-- Aplica el tema guardado antes del primer pintado para evitar destellos -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('postura_theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <!-- Google Fonts: IBM Plex Sans (UI) + Source Serif 4 (display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <!--
      SPEC-010 strangler: two sibling containers with exclusive owners.
      #app is owned by the legacy controller, #react-root by React.
      Neither owner writes into the other's subtree.
    -->
    <div id="app"></div>
    <div id="react-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
